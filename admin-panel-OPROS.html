<!doctype html>
<html lang="ru">
<head>
<link rel="icon" type="image/png" href="/favicon.png">
<title>Админ — Панель</title><link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="adminNoise"></div>
<main>
  <section id="login" class="loginScreen">
    <div class="loginCard"><div class="miniLogo">Б</div><div class="eyebrow">PRIVATE CONTROL</div><h1>БЛИЦ</h1><p>Закрытая панель управления.</p><a href="/" class="link">← Вернуться на сайт</a><div id="err"></div></div>
  </section>
  <section id="panel" class="hidden">
    <header class="adminTop">
      <div><div class="eyebrow">CONTROL ROOM</div><h1>БЛИЦ <span>/ ADMIN</span></h1></div>
      <div class="adminTopActions"><button class="backupBtn" onclick="downloadBackup()">💾 Сохранить данные</button><a href="/" class="siteLink">На сайт ↗</a></div>
    </header>
    <section class="overview" id="overview"></section>
    <section class="streamerSection">
      <div class="sectionHead"><div><span>STREAMERS</span><h2>Выбери стримера</h2></div><div class="hint">Нажми на карточку — откроется редактор</div></div>
      <div id="editors" class="streamerGrid"></div>
    </section>
    <section class="usersBox"><div class="sectionHead"><div><span>PLAYERS</span><h2>Статистика</h2></div></div><div id="stats"></div></section>
    <section class="usersBox accessSection"><div class="sectionHead"><div><span>ACCESS</span><h2>Управление доступом</h2></div><div class="hint">Выдать или забрать админку по ID</div></div><div id="access"></div></section>
  </section>
</main>
<div id="modal" class="editorModal hidden"><div class="modalShade" onclick="closeEditor()"></div><div class="modalCard"><button class="modalClose" onclick="closeEditor()">×</button><div id="modalContent"></div></div></div>
<script src="admin.js"></script>
</body></html>
